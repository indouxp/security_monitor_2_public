  <text x="495" y="279" font-family="'Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12" fill="#fcd34d" text-anchor="middle" dominant-baseline="central">必要</text>
  <text x="694" y="279" font-family="'Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12" fill="#6ee7b7" text-anchor="middle" dominant-baseline="central">不要</text>

  <!-- ==================== ROW 5: rpi4-1側の追加構成 y=307, h=50, cy=332 ==================== -->
  <rect x="10"  y="307" width="190" height="50" fill="#0f172a" rx="3"/>
  <rect x="203" y="307" width="191" height="50" fill="#0d3b20" rx="3"/>
  <rect x="397" y="307" width="197" height="50" fill="#0d3b20" rx="3"/>
