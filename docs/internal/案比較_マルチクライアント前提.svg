  <text x="105" y="65"  font-family="'Noto Sans JP','Yu Gothic UI',sans-serif" font-size="13" font-weight="bold" fill="#888"   text-anchor="middle" dominant-baseline="central">項目</text>
  <text x="298" y="54"  font-family="'Noto Sans JP','Yu Gothic UI',sans-serif" font-size="13" font-weight="bold" fill="#00cfff" text-anchor="middle">案1</text>
  <text x="298" y="74"  font-family="'Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11" fill="#00cfff" text-anchor="middle">scp + 静的 JSON</text>
  <text x="495" y="54"  font-family="'Noto Sans JP','Yu Gothic UI',sans-serif" font-size="13" font-weight="bold" fill="#00cfff" text-anchor="middle">案2</text>
  <text x="495" y="74"  font-family="'Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11" fill="#00cfff" text-anchor="middle">ローカル HTTP API</text>
  <text x="694" y="54"  font-family="'Noto Sans JP','Yu Gothic UI',sans-serif" font-size="13" font-weight="bold" fill="#00cfff" text-anchor="middle">案3 ★採用</text>
  <text x="694" y="74"  font-family="'Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11" fill="#00cfff" text-anchor="middle">HTTP POST + IP解決</text>

  <!-- ==================== ROW 1: rpi4-1メトリクス（固定） y=95, h=50, cy=120 ==================== -->
  <rect x="10"  y="95" width="190" height="50" fill="#0f172a" rx="3"/>
  <rect x="203" y="95" width="191" height="50" fill="#0d3b20" rx="3"/>
  <rect x="397" y="95" width="197" height="50" fill="#0d3b20" rx="3"/>
  <rect x="597" y="95" width="193" height="50" fill="#0d3b20" rx="3"/>

  <text x="105" y="109" font-family="'Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">rpi4-1 メトリクス</text>
  <text x="105" y="131" font-family="'Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">（固定）</text>
  <text x="298" y="120" font-family="'Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12" fill="#6ee7b7" text-anchor="middle" dominant-baseline="central">○ 対応可</text>
