  <text x="298" y="332" font-family="'Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12" fill="#6ee7b7" text-anchor="middle" dominant-baseline="central">最小</text>
  <text x="495" y="332" font-family="'Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12" fill="#6ee7b7" text-anchor="middle" dominant-baseline="central">最小</text>
