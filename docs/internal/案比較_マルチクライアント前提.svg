<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="510" viewBox="0 0 800 510">

  <!-- ==================== Background ==================== -->
  <rect width="800" height="510" fill="#0a0a0f"/>

  <!-- ==================== Title ==================== -->
  <text x="400" y="26"
        font-family="'Noto Sans JP','Yu Gothic UI','Hiragino Kaku Gothic Pro',sans-serif"
        font-size="15" font-weight="bold" fill="#00cfff" text-anchor="middle">
    案の再比較（マルチクライアント前提）
  </text>

  <!-- ==================== HEADER ROW (y=38, h=54) ==================== -->
  <rect x="10"  y="38" width="190" height="54" fill="#0d1117" rx="3"/>
  <rect x="203" y="38" width="191" height="54" fill="#1a1a2e" rx="3"/>
  <rect x="397" y="38" width="197" height="54" fill="#1a1a2e" rx="3"/>
