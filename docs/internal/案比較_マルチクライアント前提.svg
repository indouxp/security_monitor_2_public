  <text x="298" y="374" font-family="'Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12" fill="#fcd34d" text-anchor="middle">△ scp +</text>
  <text x="298" y="396" font-family="'Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12" fill="#fcd34d" text-anchor="middle">SSH 鍵設定</text>
  <text x="495" y="374" font-family="'Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12" fill="#fcd34d" text-anchor="middle">△ agent</text>
  <text x="495" y="396" font-family="'Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12" fill="#fcd34d" text-anchor="middle">インストール</text>
  <text x="694" y="385" font-family="'Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12" fill="#6ee7b7" text-anchor="middle" dominant-baseline="central">✓ curl のみ</text>

  <!-- ==================== ROW 7: Windows対応 y=413, h=50, cy=438 ==================== -->
  <rect x="10"  y="413" width="190" height="50" fill="#0f172a" rx="3"/>
  <rect x="203" y="413" width="191" height="50" fill="#3b2a0d" rx="3"/>
  <rect x="397" y="413" width="197" height="50" fill="#3b0d0d" rx="3"/>
  <rect x="597" y="413" width="193" height="50" fill="#0d3b20" rx="3"/>

  <text x="105" y="438" font-family="'Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle" dominant-baseline="central">Windows 対応</text>
  <text x="298" y="427" font-family="'Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12" fill="#fcd34d" text-anchor="middle">△ SSH 鍵</text>
  <text x="298" y="449" font-family="'Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12" fill="#fcd34d" text-anchor="middle">設定が必要</text>
  <text x="495" y="438" font-family="'Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12" fill="#fca5a5" text-anchor="middle" dominant-baseline="central">✗ 困難</text>
  <text x="694" y="438" font-family="'Noto Sans JP','Yu Gothic UI',sans-serif" font-size="12" fill="#6ee7b7" text-anchor="middle" dominant-baseline="central">✓ 標準対応</text>

  <!-- ==================== LEGEND (y=472, h=30) ==================== -->
  <rect x="10" y="472" width="780" height="30" fill="#0d1117" rx="3"/>
  <rect x="30"  y="480" width="14" height="14" fill="#0d3b20" rx="2"/>
  <text x="50"  y="487" font-family="'Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11" fill="#6ee7b7" dominant-baseline="central">✓ / ○ 対応可・良好</text>
  <rect x="230" y="480" width="14" height="14" fill="#3b2a0d" rx="2"/>
  <text x="250" y="487" font-family="'Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11" fill="#fcd34d" dominant-baseline="central">△ 条件付き・要注意</text>
  <rect x="450" y="480" width="14" height="14" fill="#3b0d0d" rx="2"/>
  <text x="470" y="487" font-family="'Noto Sans JP','Yu Gothic UI',sans-serif" font-size="11" fill="#fca5a5" dominant-baseline="central">✗ 非対応・問題あり</text>

</svg>
