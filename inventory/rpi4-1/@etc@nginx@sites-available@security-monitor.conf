# /etc/nginx/sites-available/security-monitor
# 用途: セキュリティモニター用nginx設定

server {
    listen 80;
    server_name rpi4-1.tsystem.gr.jp;

    # --- 静的ファイル配信 ---
    location / {
        root /var/www/html;
        index index.html;
    }

    # --- メトリクス: クライアントからの POST 受信 (push-daemon :9091) ---
    # /api/ の catch-all より前に定義して優先させる
    location /api/push {
        proxy_pass        http://127.0.0.1:9091;
        proxy_set_header  X-Real-IP $remote_addr;
        proxy_read_timeout 5s;
    }

    # --- メトリクス: 自クライアントの最新値 (nginx が IP でファイルを解決) ---
    location /api/my-metrics {
        alias /var/www/html/data/$remote_addr.json;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store";
    }

    # --- メトリクス: 自クライアントの履歴 NDJSON ---
    location /api/my-history {
        alias /var/www/html/data/$remote_addr-history.ndjson;
        default_type application/x-ndjson;
        add_header Cache-Control "no-cache, no-store";
    }

    # --- メトリクス: 静的データファイル配信 ---
    location /data/ {
        alias /var/www/html/data/;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store";
    }

    # --- MediaMTX WebRTCシグナリング プロキシ ---
    location /webrtc/ {
        proxy_pass http://127.0.0.1:8889/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # --- MediaMTX HLS フォールバック プロキシ ---
    location /hls/ {
        proxy_pass http://127.0.0.1:8888/;
        proxy_set_header Host $host;
    }

    # --- MediaMTX API プロキシ（接続状態確認用）---
    location /api/ {
        proxy_pass http://127.0.0.1:9997/;
        proxy_set_header Host $host;
    }
}
